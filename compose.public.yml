# Public marketing site and demo, served from published GHCR images.
name: openprint-public
#
# No reverse proxy is bundled. Both containers publish on loopback, and the
# proxy already running on the host (Caddy, nginx, ...) terminates TLS and
# forwards each hostname to its port:
#
#   openprintdash.app      -> 127.0.0.1:8080
#   demo.openprintdash.app -> 127.0.0.1:3000
#
#   export IMAGE_PREFIX=ghcr.io/schlangegoto/open-print-dashboard
#   export IMAGE_TAG=0.2.0
#   docker compose -f compose.public.yml up -d

services:
  site:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangegoto/open-print-dashboard}/site:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only. Change SITE_PORT if 8080 is taken on the host.
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  demo:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangegoto/open-print-dashboard}/demo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only. Change DEMO_PORT if 3000 is taken on the host.
      - "127.0.0.1:${DEMO_PORT:-3000}:3000"
