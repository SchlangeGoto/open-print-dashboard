services:
  db:
    image: postgres:16-alpine
    container_name: opd-db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-opd} -d ${POSTGRES_DB:-openprintdashboard}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opd}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changethis}
      - POSTGRES_DB=${POSTGRES_DB:-openprintdashboard}
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: openprintdashboard/backend:latest
    container_name: opd-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-OpenPrintDashboard}
      - SECRET_KEY=${SECRET_KEY:-}
      - BAMBU_CREDENTIALS_KEY=${BAMBU_CREDENTIALS_KEY:-}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-}
      - FRONTEND_HOST=${FRONTEND_HOST:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opd}:${POSTGRES_PASSWORD:-changethis}@db:5432/${POSTGRES_DB:-openprintdashboard}
      - BAMBU_CLOUD_MQTT_HOST=${BAMBU_CLOUD_MQTT_HOST:-us.mqtt.bambulab.com}
      - BAMBU_CLOUD_MQTT_PORT=${BAMBU_CLOUD_MQTT_PORT:-8883}
      - PRINTER_IP=${PRINTER_IP:-}
      - PRINTER_SERIAL=${PRINTER_SERIAL:-}
      - PRINTER_ACCESS_CODE=${PRINTER_ACCESS_CODE:-}
      # Mailpit runs on the Compose network; the published port is only for
      # the Mailpit web UI.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_TLS=false
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-info@example.com}
    ports:
      - "8000:8000"
    # Allow the container to reach a printer on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the source for live reload during development. Remove this
      # volume and the `command` override to run the image as built.
      - ./backend:/app/backend
      - backend_data:/app/data
    command:
      - bash
      - -c
      - "bash scripts/prestart.sh && fastapi dev --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    image: openprintdashboard/frontend:latest
    container_name: opd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Demo mode is opt-in for the full-stack setup so it talks to the real
      # backend. Local `npm run dev` enables demo mode by default.
      - NEXT_PUBLIC_DEMO_MODE=${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  mailpit:
    image: axllent/mailpit
    container_name: opd-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      # Host port 1025 is often taken; the backend reaches Mailpit over the
      # Compose network on mailpit:1025. This mapping is for local SMTP clients.
      - "11025:1025"

volumes:
  postgres_data:
  backend_data:
  frontend_node_modules:
  frontend_next:
