name: Test Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: changethis
  # Tests delete rows. Keep them on a dedicated database whose name ends in
  # _test; test.sh refuses anything else.
  POSTGRES_DB: openprintdashboard_test
  DATABASE_URL: postgresql://opd:changethis@localhost:5432/openprintdashboard_test
  TEST_DATABASE_URL: postgresql://opd:changethis@localhost:5432/openprintdashboard_test
  SMTP_HOST: localhost
  SMTP_PORT: "11025"
  SMTP_TLS: "false"
  EMAILS_FROM_EMAIL: info@example.com

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Start database and mailpit
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --wait db mailpit

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run bash scripts/lint.sh
        working-directory: backend

      - name: Migrate database
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run tests
        run: uv run bash scripts/test.sh
        working-directory: backend

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
