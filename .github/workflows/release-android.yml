name: Release Android

# Builds a signed, directly installable APK with EAS Build. There is no Play
# Store step: the APK is the release artifact. The `production` profile in
# mobile/eas.json still produces an AAB if the app ever ships to Play.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    # Only tags on main may publish an APK.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping the ancestry check."
            exit 0
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require release notes before build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git cat-file -e "origin/main:docs/release-notes/${REF_NAME}.md" || {
            echo "::error::Add docs/release-notes/${REF_NAME}.md on main before tagging."
            exit 1
          }

  build:
    needs: guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Free-tier EAS builds sit in a low-priority queue and can wait 90+ minutes.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          eas-version: 27.x
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check the app version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./app.json').expo.version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match expo.version ${version}"
            exit 1
          fi

      - name: Build signed APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Show build result
        run: cat eas-build.json

      - name: Download APK
        run: |
          mkdir -p artifacts
          url=$(jq -r '.[0].artifacts.buildUrl // empty' eas-build.json)
          [ -n "$url" ] || { echo "EAS returned no APK URL" >&2; exit 1; }
          curl -fL "$url" -o artifacts/unsigned-name.apk
          ls -lh artifacts

      - name: Name APK after the release
        id: apk
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=""
          [ "$REF_TYPE" = "tag" ] && version="$REF_NAME"
          [ -n "$version" ] || version="$(node -p "require('./app.json').expo.version")"
          name="openprint-dashboard-${version}.apk"
          mv artifacts/unsigned-name.apk "artifacts/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "artifacts/$name"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: mobile/artifacts/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      # Belt-and-braces for the artifact download and release commands.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: docs/release-notes

      - name: Require concise release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test -s "docs/release-notes/${REF_NAME}.md" || {
            echo "::error::Add docs/release-notes/${REF_NAME}.md on main, then re-run this tag."
            exit 1
          }

      - name: Download the APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh run download "$GITHUB_RUN_ID" -n android-apk -D artifacts
          ls -lh artifacts

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" --notes-file "docs/release-notes/${REF_NAME}.md"
          else
            gh release create "$REF_NAME" --notes-file "docs/release-notes/${REF_NAME}.md"
          fi
          gh release upload "$REF_NAME" artifacts/*.apk --clobber
