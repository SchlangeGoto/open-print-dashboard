<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project_name }} - Password recovery</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:20px">Password recovery</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.6">
                  Hi {{ username }}, we received a request to reset the password for your {{ project_name }} account.
                </p>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6">
                  This link is valid for {{ valid_hours }} hours. If you didn't request a password reset you can safely ignore this email.
                </p>
                <a href="{{ link }}" style="display:inline-block;background:#3b82f6;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600">
                  Reset password
                </a>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa">
            Sent by {{ project_name }} to {{ email }}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
