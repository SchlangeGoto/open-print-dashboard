[project]
name = "app"
version = "0.1.0"
description = "OpenPrintDashboard backend"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.115,<1.0.0",
    "python-multipart<1.0.0,>=0.0.9",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.9",
    "pydantic-settings<3.0.0,>=2.2.1",
    "alembic>=1.13,<2.0.0",
    "psycopg[binary]>=3.2,<4.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "cryptography>=43.0.0",
    "paho-mqtt>=2.1.0",
    "requests>=2.32.0",
    "cloudscraper>=1.2.71",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
]

[dependency-groups]
dev = [
    "pytest<9.0.0,>=8.0.0",
    "mypy<2.0.0,>=1.11.0",
    "ruff<1.0.0,>=0.6.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = ["cloudscraper", "paho.mqtt.client", "paho.mqtt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Bambu Lab integration parses dynamic third-party JSON payloads.
module = ["app.services.*"]
ignore_errors = true

[tool.ruff]
target-version = "py313"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.fastapi]
entrypoint = "app.main:app"
