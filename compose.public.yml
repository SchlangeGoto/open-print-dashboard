# Public marketing site and demo, served from published GHCR images.
name: openprint-public
#
# No reverse proxy is bundled. Both containers publish on loopback, and the
# proxy already running on the host (Caddy, nginx, Nginx Proxy Manager, Traefik,
# ...) terminates TLS and forwards each hostname to its port.
#
# The site and demo share one Compose project and one Docker host, but they keep
# separate image tags so either can be released without the other.
#
#   export IMAGE_PREFIX=ghcr.io/schlangegoto/open-print-dashboard
#   export SITE_IMAGE_TAG=0.1.0
#   export DEMO_IMAGE_TAG=0.1.0
#   docker compose -f compose.public.yml up -d
#
# See "Public site and demo" in docs/DEPLOYMENT.md.

services:
  site:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangegoto/open-print-dashboard}/site:${SITE_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only. Change SITE_PORT if 8080 is taken on the host.
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  demo:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangegoto/open-print-dashboard}/demo:${DEMO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only. Change DEMO_PORT if 3000 is taken on the host.
      - "127.0.0.1:${DEMO_PORT:-3000}:3000"
