name: Test Docker Compose

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile.prod"
      - "compose.yml"
      - "compose.prod.yml"
      - "backend/scripts/start.sh"
      - "backend/scripts/prestart.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/test-docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-docker-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          sed -i 's/^EMAILS_FROM_EMAIL=.*/EMAILS_FROM_EMAIL=/' .env
          sed -i 's/^SMTP_HOST=.*/SMTP_HOST=/' .env

      - name: Build and start production stack
        run: docker compose -f compose.prod.yml up -d --build

      - name: Wait for backend
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/utils/health-check/ >/dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.prod.yml logs --no-color
          exit 1

      - name: Check frontend
        run: curl -fsS http://localhost:3000/ >/dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f compose.prod.yml down -v --remove-orphans
