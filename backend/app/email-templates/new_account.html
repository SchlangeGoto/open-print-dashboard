<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project_name }} - New account</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:20px">Welcome to {{ project_name }}</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:1.6">
                  An account has been created for you. You can sign in with the credentials below.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;font-size:14px">
                  <tr>
                    <td style="padding:4px 12px 4px 0;color:#71717a">Email</td>
                    <td style="padding:4px 0"><strong>{{ email }}</strong></td>
                  </tr>
                  <tr>
                    <td style="padding:4px 12px 4px 0;color:#71717a">Username</td>
                    <td style="padding:4px 0"><strong>{{ username }}</strong></td>
                  </tr>
                  <tr>
                    <td style="padding:4px 12px 4px 0;color:#71717a">Password</td>
                    <td style="padding:4px 0"><strong>{{ password }}</strong></td>
                  </tr>
                </table>
                <a href="{{ link }}" style="display:inline-block;background:#3b82f6;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600">
                  Sign in
                </a>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa">
            Sent by {{ project_name }}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
