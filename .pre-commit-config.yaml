repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # compose.external-proxy.yml uses Compose's !reset tag, which PyYAML
        # cannot construct. Test Docker Compose validates it with
        # `docker compose config` and asserts the caddy service is gone.
        exclude: ^compose\.external-proxy\.yml$
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/app/.*\.py$
      - id: ruff-format
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/app/.*\.py$
