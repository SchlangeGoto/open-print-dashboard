# Public marketing site and demo, served from published GHCR images.
name: openprint-public
#
#   export IMAGE_PREFIX=ghcr.io/schlangengoto/open-print-dashboard
#   export IMAGE_TAG=0.2.0
#   export SITE_DOMAIN=openprintdash.app
#   export DEMO_DOMAIN=demo.openprintdash.app
#   docker compose -f compose.public.yml up -d
#
# For local testing, start only the app containers (no Caddy):
#   docker compose -f compose.public.yml up -d site demo
#   http://localhost:8080 and http://localhost:8081

services:
  site:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangengoto/open-print-dashboard}/site:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  demo:
    image: ${IMAGE_PREFIX:-ghcr.io/schlangengoto/open-print-dashboard}/demo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
      - demo
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-openprintdash.app}
      - DEMO_DOMAIN=${DEMO_DOMAIN:-demo.openprintdash.app}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
