name: Test Mobile

on:
  push:
    branches:
      - main
      - master
    paths:
      - "mobile/**"
      - ".github/workflows/test-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/test-mobile.yml"

permissions:
  contents: read

concurrency:
  group: test-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist-android

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir dist-ios
